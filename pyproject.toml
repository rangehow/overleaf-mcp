[project]
name = "overleaf-mcp-plus"
version = "0.2.2"
description = "The most comprehensive MCP server for Overleaf — full CRUD, compile, PDF download, git history, diff, and more. (The `overleaf-mcp` name on PyPI is taken by a smaller read-only project, hence the `-plus` suffix; the CLI command is still `overleaf-mcp`.)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "rangehow"}
]
keywords = ["mcp", "overleaf", "latex", "model-context-protocol"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Text Processing :: Markup :: LaTeX",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = [
    # 0.2.2 is the v1-SDK maintenance release: same feature set as 0.2.1,
    # but pinned below MCP SDK v2. v2 (now the default line on PyPI) removed
    # the v1 decorator API (@server.list_tools / @server.call_tool) that this
    # codebase uses, so an unbounded ``mcp>=1.0.0`` resolves to a version that
    # cannot import this server. Users ready for the v2 SDK should install
    # 0.3.0 instead (same tools, ported to the v2 registration API).
    "mcp>=1.27,<2",
    "httpx>=0.27.0",
    "gitpython>=3.1.40",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
# ``compile`` extras enable list_projects / compile / pdf / create_project —
# anything that talks to the Overleaf web dashboard (cookie-auth). Only
# beautifulsoup4 is needed (HTML scraping for CSRF token + project list).
# NOTE: playwright was once listed here but nothing imports it — removed in
# 0.1.3 to avoid a ~100 MB install.
compile = [
    "beautifulsoup4>=4.12.0",
]

[project.scripts]
overleaf-mcp = "overleaf_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/overleaf_mcp"]

[tool.hatch.build.targets.sdist]
# Explicit allowlist so we never accidentally ship dev tooling, private
# skill notes, promo screenshots, or local caches.
include = [
    "src/overleaf_mcp/*.py",
    "src/overleaf_mcp/**/*.py",
    "README.md",
    "LICENSE",
    "pyproject.toml",
    "Dockerfile",
    "docker-compose.yml",
    "overleaf_config.example.json",
]
exclude = [
    ".chatui",
    ".chatui/**",
    "promo",
    "promo/**",
    "overleaf_cache",
    "overleaf_cache/**",
    "dist",
    "dist/**",
    "*.pyc",
    "__pycache__",
    "**/__pycache__",
]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
]

[tool.ruff]
line-length = 100
target-version = "py310"
